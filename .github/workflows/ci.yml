name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - beta
      - alpha

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Test
        run: bun test tests

      - name: Build declarations
        run: bun run build:types

      - name: Check generated documentation freshness
        run: bun source/bin/index.ts docs agents --check --json

      - name: Benchmark budgets (spec 001 / 002)
        run: bun run scripts/bench.ts --check
