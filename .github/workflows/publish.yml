name: Publish

on:
  push:
    branches:
      - main
      - beta
      - alpha

permissions:
  contents: write      # To commit version changes and tags
  issues: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # IMPORTANT for version tags

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Update version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run version

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit version changes
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git add package.json CHANGELOG.md
          git commit -m "chore(release): v${VERSION} [skip ci]"

      - name: Tag release
        # update-version.ts crée déjà le tag vX.Y.Z sur HEAD. On le force ici sur
        # le commit de release (qui porte le package.json versionné) afin que le
        # tag pointe vers le bon commit.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git tag -f "v${VERSION}"

      - name: Push changes
        run: |
          git push origin HEAD:${{ github.ref }}
          git push origin --tags

      - name: Publish to npm
        run: |
          bun run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
